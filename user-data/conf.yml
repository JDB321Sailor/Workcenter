# yaml-language-server: $schema=./src/utils/config/ConfigSchema.json
---
# Page meta info. The title appears in the browser tab and the page title.
pageInfo:
  title: Workcenter
  description: Files, chat and mail in one place

# Shell settings
appConfig:
  theme: default
  # The address of each application the shell embeds. A pane with no address is
  # shown as unavailable rather than silently blank. The Mail pane points at
  # SOGo, which Mailcow serves under /SOGo.
  applications:
    files:
      url: https://filebrowser.example.com
    chat:
      url: https://chat.example.com
    mail:
      url: https://mail.example.com/SOGo
  # The appearance mode starts dark; a user's own choice is remembered locally.
  # An operator can still select an inherited theme with `theme`, which wins for
  # the tokens that theme defines.
  defaultOpeningMethod: newtab

  auth:
    # Authentik is the identity provider for Workcenter and for every
    # application it deploys. See OIDC.md.
    enableOidc: false
    oidc:
      clientId: workcenter
      endpoint: https://auth.example.com/application/o/workcenter/
      adminGroup: workspaceadmin
      scope: openid profile email groups
      enableSilentRenew: true
