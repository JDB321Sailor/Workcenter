# FileBrowser Quantum 2.0.9-beta — the v2 configuration schema.
#
# v2 has EXACTLY six top-level keys — `server`, `http`, `auth`, `frontend`,
# `userDefaults`, `integrations` — and decoding is strict: an unknown key inside
# one of them is a fatal startup error, while an unknown top-level key is
# silently dropped, so a misspelled section looks accepted (I-FB-2, IN-3.22).
# Every key below is accepted by the pinned version; nothing here is invented.
#
# Secrets are never written in this file (AR-19, S-CF-5): the client credentials,
# the session key and the OnlyOffice secret are injected through the environment
# and override the empty values below. `setup.sh` rewrites the example.com
# hostnames at setup time (production.md §5.2, §5.4); the file itself is mounted
# read-only, because the application never edits it.

server:
  # SQLite database. IN-3.2: `server.database.path` wins over
  # FILEBROWSER_DATABASE_PATH, so the path is set here and nowhere else.
  database:
    path: "/home/filebrowser/data/database.sqlite"
  # The user file tree, mounted read-write at /srv/files. It is the same host
  # directory the Workcenter container mounts, and the broker asserts that at
  # startup before it offers the by-path flows (IN-9.6, AR-35, BR-5.3).
  sources:
    - path: "/srv/files"
      name: "Files"
      config:
        # REQUIRED. Without it a user created through OIDC has no source enabled
        # and sees an empty tree (IN-3.4, I-FB-4).
        defaultEnabled: true
        defaultPermissions:
          view: true
          download: true
          modify: true
          create: true
          delete: true
  # Thumbnails and other generated files: a separate bind mount, so the office
  # cache survives the database being rebuilt (I-FB-3).
  cacheDir: "/home/filebrowser/data/cache"

http:
  # The container port Traefik targets and the healthcheck probes.
  port: 80
  # Served at the subdomain root. The OIDC redirect URI is derived from the
  # incoming request — https://<host><baseURL>api/auth/oidc/callback — and not
  # from externalUrl, so it is the request host, with no subpath, that must be
  # registered in Authentik (IN-3.5).
  baseURL: "/"
  # Used for share links. setup.sh writes the deployment's own host here.
  externalUrl: "https://filebrowser.example.com"
  # OnlyOffice and the broker call back here, bypassing Traefik, so this is the
  # compose service name and the container port (integration.md §4.3).
  internalUrl: "http://filebrowser:80"
  # REQUIRED behind Traefik: the redirect URI, the session cookie and every
  # generated URL are built from X-Forwarded-Proto/-Host (IN-3.5, I-FB-6).
  trustProxyHeaders: true
  # WebDAV is a documented FileBrowser surface the broker does not use — it
  # reaches files over /api/ — so it stays available rather than disabled here.
  disableWebDAV: false

auth:
  methods:
    # Authentik is the only way in (A-1, I-FB-5). The block is present but inert
    # here for one reason: provider discovery runs **at startup** and a failure
    # stops the application (IN-3.6), so a committed `enabled: true` would make
    # every container start depend on an identity provider being up and correctly
    # configured. `setup.sh` flips `enabled`, and `scripts/e2e.sh` writes a copy
    # carrying the test run's issuer and client credentials.
    #
    # The values it writes are the ones below, all of which OIDC.md §6.2 fixes:
    #
    #   issuerUrl          the **bare per-application issuer**, trailing slash
    #                      included. A client appends the discovery path itself;
    #                      naming `/.well-known/openid-configuration` here is the
    #                      classic redirect loop (O-4.1).
    #   scopes             must contain `groups`, which is the only reason the
    #                      claim arrives at all (O-6.1, IN-7.6)
    #   groupsClaim        the claim the `groups` scope mapping emits
    #   userIdentifier     `preferred_username`, which OIDC.md §4.2's mapping and
    #                      Authentik's `profile` scope both supply
    #   adminGroup         the group that grants administrative rights (A-5)
    #   userGroups         **who may sign in at all.** O-3.3 keeps access control
    #                      and privilege apart: this list is the first, adminGroup
    #                      is the second. A user outside it is refused with 403
    #                      (IN-3.8)
    #   logoutRedirectUrl  Authentik's end-session endpoint for this provider,
    #                      so signing out here ends the session everywhere (A-7)
    #
    # FILEBROWSER_OIDC_CLIENT_ID and _SECRET reach the container as environment
    # variables (Filebrowser/compose.yaml) and never live in this file (AR-19,
    # S-CF-5); the generated copy names them through its own substituted values.
    oidc:
      enabled: false
      issuerUrl: "https://auth.example.com/application/o/filebrowser/"
      clientId: "filebrowser"
      clientSecret: ""
      scopes: "openid email profile groups"
      groupsClaim: "groups"
      userIdentifier: "preferred_username"
      adminGroup: "workspaceadmin"
      userGroups:
        - "workspaceusers"
      logoutRedirectUrl: "https://auth.example.com/application/o/filebrowser/end-session/"
    # Local password login is off in a deployment and off here. It stays declared
    # because the *key* is the contract: with no method enabled the pinned version
    # falls back to password authentication, which is what lets a container start
    # on a host where Authentik does not exist yet.
    password:
      enabled: false

frontend:
  name: "Files"
  # Branding (U-22). setup.sh writes the Workcenter icons and stylesheet here;
  # empty values fall back to the image's embedded defaults, so an unbranded
  # checkout still starts (IN-3.17).
  favicon: ""
  loginIcon: ""
  disableDefaultLinks: false
  styling:
    # FileBrowser Quantum is Workcenter's palette source, so the instance
    # background and the accent are its own values — --background light and dark
    # in design.md §4.3.1 — and never a second palette.
    lightBackground: "#f5f5f5"
    darkBackground: "#141D24"
    # setup.sh points this at the Workcenter stylesheet that also makes room for
    # the shell's switcher, so branding adds no second injection point
    # (IN-3.9, IN-3.17).
    customCSS: ""

userDefaults:
  ui:
    # Workcenter defaults to dark. This applies to users created afterwards and
    # is never re-imposed on an existing user (IN-3.18, I-FB-15).
    darkMode: true
    # The Files accent: FileBrowser's own --primaryColor (design.md D-T4).
    themeColor: "#2196f3"
    # FileBrowser's own locale keys, not BCP-47 (IN-3.21); setup.sh writes the
    # deployment's default language.
    locale: "en"

integrations:
  office:
    # Browser -> OnlyOffice: must be reachable from the user's browser
    # (integration.md §4.3).
    url: "https://office.example.com"
    # FileBrowser -> OnlyOffice: over the internal network, bypassing Traefik.
    internalUrl: "http://onlyoffice:80"
    # Supplied by FILEBROWSER_ONLYOFFICE_SECRET and byte-identical to the
    # OnlyOffice JWT_SECRET. Never inline (IN-4.2, AR-19).
    secret: ""
